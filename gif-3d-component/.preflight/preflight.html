<head>

    <title>Preflight</title>
    <style id="theme-vars">
/* GIF 3D Component — Brand CSS */
:root {
  --gif3d-background: #0a0a0f;
  --gif3d-foreground: #f0e6d3;
  --gif3d-card: #1a1a2e;
  --gif3d-card-foreground: #f0e6d3;
  --gif3d-popover: #1a1a2e;
  --gif3d-popover-foreground: #f0e6d3;
  --gif3d-primary: #c41e3a;
  --gif3d-primary-foreground: #ffffff;
  --gif3d-muted: #2a2a3e;
  --gif3d-muted-foreground: #a09888;
  --gif3d-border: #3a3a4e;
  --gif3d-input: #2a2a3e;
  --gif3d-ring: #c41e3a;
  --gif3d-radius-sm: 8px;
  --gif3d-radius-md: 12px;
  --gif3d-radius-lg: 20px;
  --gif3d-gold: #d4a853;
  --gif3d-gold-light: #f0d080;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--gif3d-background);
    --color-foreground: var(--gif3d-foreground);
    --color-card: var(--gif3d-card);
    --color-card-foreground: var(--gif3d-card-foreground);
    --color-popover: var(--gif3d-popover);
    --color-popover-foreground: var(--gif3d-popover-foreground);
    --color-primary: var(--gif3d-primary);
    --color-primary-foreground: var(--gif3d-primary-foreground);
    --color-muted: var(--gif3d-muted);
    --color-muted-foreground: var(--gif3d-muted-foreground);
    --color-border: var(--gif3d-border);
    --color-input: var(--gif3d-input);
    --color-ring: var(--gif3d-ring);
    --radius-sm: var(--gif3d-radius-sm);
    --radius-md: var(--gif3d-radius-md);
    --radius-lg: var(--gif3d-radius-lg);
  }
  @layer base {
    body { background: var(--gif3d-background); color: var(--gif3d-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .no-scrollbar::-webkit-scrollbar { display: none; }
